- name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Run Google News RSS & AI Briefing Script
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: python update_briefing.py

  - name: Commit and push updated data.json
    run: |
      git config --local user.email "github-actions[bot]@users.noreply.github.com"
      git config --local user.name "github-actions[bot]"
      git add data.json
      git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-sync daily briefing data"
      git push
